name: js-joda build and test

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.OS }}-node-
      - name: Install and bootstrap
        shell: bash
        run: |
          mkdir -p build/deps
          set -o pipefail
          npm install 2>&1 | tee build/deps/npm-install.log
          npx lerna clean -y
          npx lerna link
          npx lerna bootstrap --no-ci
      - name: Capture dependency baseline
        run: npm run audit:deps
      - name: Upload dependency baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-baseline
          path: build/deps
          if-no-files-found: error
      - name: Check refactor compatibility
        run: npm run check:refactor
      - name: Build distributions
        run: npx lerna run --stream build-dist
      - name: Build locale distributions
        run: npx lerna run --stream build-locale-dist
      - name: Lint
        run: npx lerna run --stream lint
      - name: Build API documentation
        run: npm run build-esdoc
      - name: Test core
        run: npx lerna run --scope @js-joda/core --stream test
      - name: Test extra
        run: npx lerna run --scope @js-joda/extra --stream test
      - name: Test locale
        run: npx lerna run --scope @js-joda/locale --stream test
      - name: Test timezone
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          npx lerna run --scope @js-joda/timezone --stream test 2>&1 | tee build/timezone-test.log
      - name: Upload timezone test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timezone-test-log
          path: build/timezone-test.log
          if-no-files-found: ignore
      - name: Test TypeScript declarations
        run: npx lerna run --stream test-ts-definitions
      - name: Generate package coverage
        run: npx lerna run --stream test-coverage
      - name: Run browser tests
        run: npx lerna run --concurrency 1 --stream test-browser -- -- --browserNoActivityTimeout 20000
      - name: Build combined coverage report
        run: npm run build-test-coverage-report
      - name: Push coverage data to coveralls
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: ./build/coverage/lcov.info
