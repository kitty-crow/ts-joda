name: js-joda build and test

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'

permissions:
  contents: write

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.OS }}-node-
      - name: Install workspaces
        shell: bash
        run: |
          mkdir -p build/deps
          rm -rf node_modules packages/*/node_modules packages/locale/packages/*/node_modules
          rm -f package-lock.json
          set +e
          set -o pipefail
          npm install 2>&1 | tee build/deps/npm-install.log
          code=${PIPESTATUS[0]}
          cp -f ~/.npm/_logs/*.log build/deps/ 2>/dev/null || true
          exit "$code"
      - name: Capture dependency report
        run: npm run audit:deps
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: |
            build/deps
            package-lock.json
          if-no-files-found: error
      - name: Commit workspace lock
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m 'refactor(build): refresh workspace lock [skip ci]'
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Check refactor compatibility
        run: npm run check:refactor
      - name: Build distributions
        run: npm run build:dist
      - name: Build locale distributions
        run: npm run build:locale
      - name: Lint
        run: npm run lint
      - name: Build API documentation
        run: npm run build-esdoc
      - name: Test core
        run: npm run test --workspace @js-joda/core
      - name: Test extra
        run: npm run test --workspace @js-joda/extra
      - name: Test locale
        run: npm run test --workspace @js-joda/locale
      - name: Test timezone
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          npm run test --workspace @js-joda/timezone 2>&1 | tee build/timezone-test.log
      - name: Upload timezone test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timezone-test-log
          path: build/timezone-test.log
          if-no-files-found: ignore
      - name: Test TypeScript declarations
        run: npm run test:definitions
      - name: Generate package coverage
        run: npm run test:coverage
      - name: Run browser tests
        run: npm run test:browser
      - name: Build combined coverage report
        run: npm run build-test-coverage-report
      - name: Push coverage data to coveralls
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: ./build/coverage/lcov.info
