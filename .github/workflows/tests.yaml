name: js-joda build and test

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install workspaces
        shell: bash
        run: |
          mkdir -p build/deps
          rm -rf node_modules packages/*/node_modules packages/locale/packages/*/node_modules
          set +e
          set -o pipefail
          npm ci 2>&1 | tee build/deps/npm-install.log
          code=${PIPESTATUS[0]}
          cp -f ~/.npm/_logs/*.log build/deps/ 2>/dev/null || true
          exit "$code"
      - name: Capture dependency report
        run: npm run audit:deps
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: build/deps
          if-no-files-found: error
      - name: Check refactor compatibility
        run: npm run check:refactor
      - name: Build distributions
        run: npm run build:dist
      - name: Build locale distributions
        run: npm run build:locale
      - name: Lint
        run: npm run lint
      - name: Build API documentation
        run: npm run build-esdoc
      - name: Test core
        run: npm run test --workspace @js-joda/core
      - name: Test extra
        run: npm run test --workspace @js-joda/extra
      - name: Test locale
        run: npm run test --workspace @js-joda/locale
      - name: Test timezone
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          npm run test --workspace @js-joda/timezone 2>&1 | tee build/timezone-test.log
      - name: Upload timezone test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timezone-test-log
          path: build/timezone-test.log
          if-no-files-found: ignore
      - name: Test TypeScript declarations
        run: npm run test:definitions
      - name: Generate package coverage
        run: npm run test:coverage
      - name: Build combined coverage report
        run: npm run build-test-coverage-report
      - name: Push coverage data to coveralls
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: ./build/coverage/lcov.info
      - name: Browser test core
        id: browser-core
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/browser
          set +e
          set -o pipefail
          failed=0
          for browser in ChromeHeadless FirefoxHeadless; do
            timeout 15m npm run test-browser --workspace @js-joda/core -- \
              --browsers "$browser" \
              --browserNoActivityTimeout 20000 \
              2>&1 | tee "build/browser/core-${browser}.log"
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Browser test extra
        id: browser-extra
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/browser
          set +e
          set -o pipefail
          failed=0
          for browser in ChromeHeadless FirefoxHeadless; do
            timeout 15m npm run test-browser --workspace @js-joda/extra -- \
              --browsers "$browser" \
              --browserNoActivityTimeout 20000 \
              2>&1 | tee "build/browser/extra-${browser}.log"
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Browser test locale
        id: browser-locale
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/browser
          set +e
          set -o pipefail
          failed=0
          for browser in ChromeHeadless FirefoxHeadless; do
            timeout 15m npm run test-browser --workspace @js-joda/locale -- \
              --browsers "$browser" \
              --browserNoActivityTimeout 20000 \
              2>&1 | tee "build/browser/locale-${browser}.log"
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Browser test timezone
        id: browser-timezone
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/browser
          set +e
          set -o pipefail
          failed=0
          for browser in ChromeHeadless FirefoxHeadless; do
            timeout 15m npm run test-browser --workspace @js-joda/timezone -- \
              --browsers "$browser" \
              --browserNoActivityTimeout 20000 \
              2>&1 | tee "build/browser/timezone-${browser}.log"
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Upload browser test logs
        if: always() && steps.browser-core.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-logs
          path: build/browser
          if-no-files-found: ignore
      - name: Check browser test results
        if: always() && steps.browser-core.outcome != 'skipped'
        shell: bash
        run: |
          failed=0
          for result in \
            '${{ steps.browser-core.outcome }}' \
            '${{ steps.browser-extra.outcome }}' \
            '${{ steps.browser-locale.outcome }}' \
            '${{ steps.browser-timezone.outcome }}'; do
            if [ "$result" != success ]; then
              failed=1
            fi
          done
          exit "$failed"
