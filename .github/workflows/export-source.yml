name: Export source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive repository
        run: git archive --format=tar.gz --output=ts-joda-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ts-joda-source
          path: ts-joda-source.tar.gz
          if-no-files-found: error
          retention-days: 1
